<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gem Bastion - 宝石タワーディフェンス</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>💎 Gem Bastion</h1>
    <p>宝石を配置して、闇のクリーチャーからコアを守ろう。</p>
  </header>

  <main>
    <section class="hud">
      <div>ウェーブ: <span id="wave">1</span></div>
      <div>ライフ: <span id="lives">20</span></div>
      <div>エネルギー: <span id="gold">120</span></div>
      <button id="startWaveBtn">ウェーブ開始</button>
    </section>

    <section class="panel">
      <h2>タワー</h2>
      <div class="tower-buttons">
        <button data-type="ruby">🔴 ルビー (50)</button>
        <button data-type="sapphire">🔵 サファイア (60)</button>
        <button data-type="emerald">🟢 エメラルド (70)</button>
      </div>
      <p id="hint">タワーを選んで空きマスをクリック</p>
    </section>

    <canvas id="game" width="900" height="500"></canvas>
  </main>

  <script src="game.js"></script>
</body>
</html>
